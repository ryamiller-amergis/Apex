name: PR Tests & Dev Deploy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev

env:
  NODE_VERSION: '24.x'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.detect.outputs.has_migration_changes }}
      markdown_only: ${{ steps.markdown_only.outputs.markdown_only }}
      load_test_runner: ${{ steps.load_test_runner.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect migration file changes
        id: detect
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/has-migration-changes.mjs

      - name: Detect markdown-only changes
        id: markdown_only
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name == 'workflow_dispatch' && 'pull_request' || github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci/is-markdown-only-changes.mjs

      - name: Detect load-test runner changes
        id: load_test_runner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || format('origin/{0}', github.event.repository.default_branch) }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            runners/load-test-k6/ \
            scripts/ci/publish-lt-k6-runner.sh \
            src/server/services/loadTestRunner/ \
            src/shared/types/loadTest.ts \
            package.json \
            package-lock.json \
            tsconfig.server.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  docs-only:
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Skip tests and dev deploy for documentation-only PRs
        run: echo "Markdown-only PR — skipping unit tests and dev deployment."

  validate:
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check (client)
        run: npx tsc -p tsconfig.client.json --noEmit

      - name: TypeScript type-check (server)
        run: npx tsc -p tsconfig.server.json --noEmit

      - name: Lint (ESLint and theme contrast)
        run: npm run lint:check

  unit-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [server, client]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.project }} unit tests
        run: npm test -- --ci --selectProjects ${{ matrix.project }}

  # Preserve the existing required "test" status check while the expensive
  # client/server suites run in parallel matrix jobs.
  test:
    needs: [detect-changes, validate, unit-test]
    if: always() && needs.detect-changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Verify validation and unit tests passed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          UNIT_TEST_RESULT: ${{ needs.unit-test.result }}
        run: |
          if [[ "$VALIDATE_RESULT" != "success" || "$UNIT_TEST_RESULT" != "success" ]]; then
            echo "Validation result: $VALIDATE_RESULT"
            echo "Unit-test result: $UNIT_TEST_RESULT"
            exit 1
          fi

  build:
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        env:
          VITE_TEAMS: ${{ vars.VITE_TEAMS }}
          VITE_NUTRIENT_LICENSE_KEY: ${{ secrets.VITE_NUTRIENT_LICENSE_KEY }}
          VITE_APRYSE_WEBVIEWER_LICENSE_KEY: ${{ secrets.VITE_APRYSE_WEBVIEWER_LICENSE_KEY }}
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dev-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  integration-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.markdown_only != 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aipilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aipilot_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations to integration test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aipilot_e2e
        run: npm run migrate:up

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/aipilot_e2e
        run: npm run test:integration

  e2e-smoke:
    needs: [detect-changes, validate, unit-test]
    if: >-
      needs.detect-changes.outputs.markdown_only != 'true' &&
      needs.validate.result == 'success' &&
      needs.unit-test.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aipilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aipilot_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E smoke tests
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/aipilot_e2e
          SESSION_SECRET: e2e-ci-secret-not-for-production
          VITE_TEAMS: 'false'
        run: npm run test:e2e:smoke

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-results
          path: playwright-results/
          retention-days: 7

  e2e-interview-flow:
    needs: [detect-changes, validate, unit-test]
    if: >-
      needs.detect-changes.outputs.markdown_only != 'true' &&
      needs.validate.result == 'success' &&
      needs.unit-test.result == 'success'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aipilot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aipilot_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run interview-flow E2E tests
        env:
          CI: true
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/aipilot_e2e
          SESSION_SECRET: e2e-ci-secret-not-for-production
          VITE_TEAMS: 'false'
        run: npm run test:e2e:interview-flow

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-interview-flow-results
          path: playwright-results/
          retention-days: 7

  migrate-check:
    needs: detect-changes
    if: needs.detect-changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: aipilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d aipilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration sequence
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/aipilot
        run: node scripts/ci/validate-migrations.mjs

  deploy-dev:
    needs:
      [
        test,
        validate,
        unit-test,
        build,
        integration-test,
        e2e-smoke,
        e2e-interview-flow,
        detect-changes,
        migrate-check,
      ]
    # always() is required: when the PR has no migration file changes, migrate-check
    # is skipped and GitHub would otherwise skip deploy-dev too — even though app-only
    # PRs should still deploy to dev.
    if: >-
      always() && !cancelled() &&
      needs.detect-changes.outputs.markdown_only != 'true' &&
      needs.test.result == 'success' &&
      needs.validate.result == 'success' &&
      needs.unit-test.result == 'success' &&
      needs.build.result == 'success' &&
      needs.integration-test.result == 'success' &&
      needs.e2e-smoke.result == 'success' &&
      needs.e2e-interview-flow.result == 'success' &&
      (needs.detect-changes.outputs.migrations != 'true' || needs.migrate-check.result == 'success')
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: pr-dev-${{ github.head_ref || github.ref_name }}
      cancel-in-progress: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        # Native production dependencies (including sqlite3) require lifecycle
        # scripts to install their Linux bindings. prepare tolerates omitted Husky.
        run: npm ci --omit=dev

      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: dev-build-${{ github.sha }}
          path: dist/

      - name: Detect migration changes
        id: migration_changes
        env:
          MIGRATION_DETECT_STRATEGY: db
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ci/has-migration-changes.mjs

      - name: Run database migrations
        if: steps.migration_changes.outputs.has_migration_changes == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run migrate:up

      - name: Create deployment package
        run: |
          mkdir -p deploy/dist
          cp -r dist/* deploy/dist/
          cp package*.json deploy/
          cp server.js deploy/ 2>/dev/null || true
          cp -r scripts deploy/
          # Platform Admin APEX Skills reads this at runtime for the skill picker /
          # Skills matrix. Without it the UI shows 0 skills after deploy.
          mkdir -p deploy/foundation-skills deploy/dist/foundation-skills
          cp foundation-skills/catalog.json deploy/foundation-skills/catalog.json
          cp foundation-skills/catalog.json deploy/dist/foundation-skills/catalog.json
          mv node_modules deploy/
          (cd deploy && zip -r ../deploy.zip .)

      - name: Verify packaged native dependencies
        run: node -e "require('./deploy/node_modules/sqlite3'); console.log('sqlite3 binding loaded')"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Extract Azure credentials
        run: |
          echo "AZURE_TENANT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.tenantId')" >> $GITHUB_ENV
          echo "AZURE_CLIENT_ID=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientId')" >> $GITHUB_ENV
          echo "AZURE_CLIENT_SECRET=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | jq -r '.clientSecret')" >> $GITHUB_ENV

      - name: Set App Service Configuration
        env:
          APP_NAME: app-scrum-dev
          RG_NAME: rg-scrum-dev
        run: |
          az webapp config appsettings set \
            --name $APP_NAME \
            --resource-group $RG_NAME \
            --settings \
              SCM_DO_BUILD_DURING_DEPLOYMENT=false \
              ENABLE_ORYX_BUILD=false \
              WEBSITE_RUN_FROM_PACKAGE=1 \
              NODE_ENV=production \
              ADO_ORG="${{ secrets.ADO_ORG }}" \
              ADO_PAT="${{ secrets.ADO_PAT }}" \
              ADO_PROJECT="${{ secrets.ADO_PROJECT }}" \
              ADO_AREA_PATH="${{ secrets.ADO_PROJECT }}" \
              ADO_ALLOWED_PROJECTS="${{ vars.ADO_ALLOWED_PROJECTS }}" \
              VITE_ADO_ORG="amergis" \
              VITE_ADO_PROJECT="${{ secrets.ADO_PROJECT }}" \
              VITE_TEAMS="${{ vars.VITE_TEAMS }}" \
              APRYSE_LICENSE_KEY="${{ secrets.APRYSE_LICENSE_KEY }}" \
              AZURE_TENANT_ID="${{ env.AZURE_TENANT_ID }}" \
              AZURE_CLIENT_ID="${{ env.AZURE_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ env.AZURE_CLIENT_SECRET }}" \
              AZURE_REDIRECT_URL="${{ secrets.AZURE_REDIRECT_URL }}" \
              AZURE_COST_TENANT_ID="${{ secrets.AZURE_COST_TENANT_ID }}" \
              AZURE_COST_CLIENT_ID="${{ secrets.AZURE_COST_CLIENT_ID }}" \
              AZURE_COST_CLIENT_SECRET="${{ secrets.AZURE_COST_CLIENT_SECRET }}" \
              SESSION_SECRET="${{ secrets.SESSION_SECRET }}" \
              CURSOR_API_KEY="${{ secrets.CURSOR_API_KEY }}" \
              CURSOR_TEAM_API_KEY="${{ secrets.CURSOR_TEAM_API_KEY }}" \
              AGENT_RUN_HARD_LIMIT_MS="${{ secrets.AGENT_RUN_HARD_LIMIT_MS }}" \
              PORT=8080 \
              POLL_INTERVAL=30 \
              WEBSITES_ENABLE_APP_SERVICE_STORAGE=true \
              AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              AWS_REGION="${{ secrets.AWS_REGION }}" \
              BEDROCK_MODEL_ID="${{ secrets.BEDROCK_MODEL_ID }}" \
              BEDROCK_UI_MOCK_MODEL_ID="${{ secrets.BEDROCK_UI_MOCK_MODEL_ID }}" \
              BEDROCK_UI_MOCK_MAX_TOKENS="32000" \
              MAXVIEW_DS_PROJECT="MaxView" \
              MAXVIEW_DS_REPO="MaxView" \
              MAXVIEW_CLIENTAPP_ROOT="/src/Maxim.TimeClock.Web/ClientApp/js" \
              DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              APPLICATIONINSIGHTS_CONNECTION_STRING="${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}" \
              PDF_BLOB_ACCOUNT_NAME="${{ vars.PDF_BLOB_ACCOUNT_NAME }}" \
              PDF_BLOB_CONTAINER_NAME="${{ vars.PDF_BLOB_CONTAINER_NAME }}" \
              GROUNDING_BLOB_ACCOUNT_NAME="${{ vars.GROUNDING_BLOB_ACCOUNT_NAME }}" \
              GROUNDING_BLOB_CONTAINER_NAME="${{ vars.GROUNDING_BLOB_CONTAINER_NAME }}" \
              LT_SERVICEBUS_NAMESPACE="${{ vars.LT_SERVICEBUS_NAMESPACE }}" \
              LT_SERVICEBUS_QUEUE_NAME="${{ vars.LT_SERVICEBUS_QUEUE_NAME }}" \
              LT_BLOB_ACCOUNT_NAME="${{ vars.LT_BLOB_ACCOUNT_NAME }}" \
              LT_BLOB_CONTAINER_NAME="${{ vars.LT_BLOB_CONTAINER_NAME }}" \
              LT_APEX_CALLBACK_BASE_URL="${{ vars.LT_APEX_CALLBACK_BASE_URL || 'https://app-scrum-dev.azurewebsites.net' }}" \
              LT_RUNNER_CALLBACK_TOKEN="${{ secrets.LT_RUNNER_CALLBACK_TOKEN }}" \
              SENDGRID_API_KEY="${{ secrets.SENDGRID_API_KEY }}" \
              GITHUB_TOKEN="${{ secrets.GH_SKILL_TOKEN }}" \
              GITHUB_ORG="${{ secrets.GH_SKILL_ORG }}" \
              TAVILY_AUTH="${{ secrets.TAVILY_AUTH }}" \
              AZURE_ARTIFACTS_ORG="${{ secrets.AZURE_ARTIFACTS_ORG }}" \
              AZURE_ARTIFACTS_FEED="${{ secrets.AZURE_ARTIFACTS_FEED }}" \
              AZURE_ARTIFACTS_PAT="${{ secrets.AZURE_ARTIFACTS_PAT }}" \
              APEX_URL="https://app-scrum-dev.azurewebsites.net"

          # The Azure Node/Linux image ships without git, and the Dev Workbench
          # feature shells out to git at runtime. Install it on boot before
          # starting the app. safe.directory is handled in application code
          # (repoCheckoutService.ts), so it is intentionally not set here.
          az webapp config set \
            --name $APP_NAME \
            --resource-group $RG_NAME \
            --linux-fx-version "NODE|24-lts" \
            --startup-file 'bash -c "(command -v git >/dev/null 2>&1 || (apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y git || true) &) && exec node /home/site/wwwroot/dist/server/index.js"'

          az webapp update \
            --name $APP_NAME \
            --resource-group $RG_NAME \
            --set clientAffinityEnabled=true

      - name: Deploy to Dev App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: app-scrum-dev
          package: ./deploy.zip

      - name: Publish load-test k6 runner image
        if: needs.detect-changes.outputs.load_test_runner == 'true'
        env:
          LT_ACR_NAME: ${{ vars.LT_ACR_NAME }}
          LT_CONTAINER_APP_JOB_NAME: ${{ vars.LT_CONTAINER_APP_JOB_NAME }}
          LT_RESOURCE_GROUP: ${{ vars.LT_RESOURCE_GROUP || 'rg-scrum-dev' }}
          IMAGE_TAG: ${{ github.sha }}
        run: bash scripts/ci/publish-lt-k6-runner.sh

      - name: Azure logout
        run: az logout
        if: always()

  # Post-deploy read-only smoke against the deployed dev site. Runs the
  # `deployed-smoke` Playwright project (no local server, no seeding) against the
  # dev URL. BLOCKING: a smoke failure fails the run so regressions introduced by
  # the branch's changes are caught and fixed rather than silently deployed. CI
  # retries (retries: 2 in playwright.config.ts) absorb transient infra flakes.
  #
  # AUTH: deployed dev runs with NODE_ENV=production, so /auth/dev-login is gated
  # OFF there. Authenticated smoke logs in via FULLY-AUTOMATED programmatic Azure
  # AD SSO — the `setup` Playwright project drives the real Entra login form using
  # the dedicated test-account credentials and produces a fresh, ephemeral
  # storageState each run (no stored/manually-captured session blob). When the
  # credentials are absent, only the unauthenticated @prod-safe boundary passes.
  #
  # Required repo config:
  #   vars.E2E_DEV_BASE_URL     (optional) dev URL; defaults to app-scrum-dev.
  #   secrets.E2E_TEST_USER     dedicated Azure AD E2E test account UPN/email.
  #   secrets.E2E_TEST_PASSWORD password for that account.
  #
  # The E2E test account MUST be exempt from MFA / conditional access for dev —
  # programmatic login cannot clear an interactive MFA challenge.
  deployed-smoke-dev:
    needs: [deploy-dev]
    if: always() && !cancelled() && needs.deploy-dev.result == 'success'
    runs-on: ubuntu-latest
    # No `environment:` — reads repo-level vars/secrets; read-only smoke stays ungated.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          PLAYWRIGHT_VERSION=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$PLAYWRIGHT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # Deployed App Service cold-starts after each deploy (the startup command even
      # reinstalls git before Node boots), so the first requests can hang or 5xx.
      # Poll the SPA root until it serves 200 so the smoke run doesn't race the boot.
      - name: Wait for deployed dev app to be ready (warm-up)
        env:
          E2E_BASE_URL: ${{ vars.E2E_DEV_BASE_URL || 'https://app-scrum-dev.azurewebsites.net' }}
        run: |
          echo "Warming up ${E2E_BASE_URL} (waiting for the SPA to serve)..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${E2E_BASE_URL}/home" || echo "000")
            echo "Attempt $i: GET /home -> $code"
            if [ "$code" = "200" ]; then
              echo "Deployed dev app is serving — proceeding to smoke."
              exit 0
            fi
            sleep 10
          done
          echo "Deployed dev app did not become ready within the warm-up window." >&2
          exit 1

      - name: Run setup + deployed-smoke against dev
        env:
          CI: true
          E2E_BASE_URL: ${{ vars.E2E_DEV_BASE_URL || 'https://app-scrum-dev.azurewebsites.net' }}
          E2E_TEST_USER: ${{ secrets.E2E_TEST_USER }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test --project=deployed-smoke

      - name: Upload deployed-smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-smoke-dev-results-${{ github.run_id }}
          path: playwright-results/
          retention-days: 7
