name: Publish @apex/skills

# Trigger when foundation-skills sources change on main.
# Every successful run produces an immutable candidate in the Azure Artifacts
# Local view. A Platform Admin then manually promotes it to the Release view
# via the APEX UI (POST /api/platform-admin/foundation-skills/releases/:id/publish).

on:
  push:
    branches:
      - main
    paths:
      - 'foundation-skills/**'
      - 'scripts/validate-foundation-skills.mjs'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — build and validate without publishing'
        type: boolean
        default: false

env:
  NODE_VERSION: '24.x'

jobs:
  validate-and-publish:
    name: Validate foundations and publish candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Install root deps (needed for root-level validate script + any shared tools).
      - name: Install root dependencies
        run: npm ci

      # Run the no-project-context lint and structural validation over all 30 foundations.
      - name: Validate foundation package
        run: node scripts/validate-foundation-skills.mjs

      # Build one immutable tarball. This exact file is tested, published, and
      # retained for release integrity checks.
      - name: Pack and verify release artifact
        working-directory: foundation-skills
        run: |
          set -euo pipefail
          rm -rf artifacts
          mkdir -p artifacts
          npm pack --json --pack-destination artifacts > artifacts/pack.json
          TARBALL=$(node -e "const fs=require('fs'); const [result]=JSON.parse(fs.readFileSync('artifacts/pack.json','utf8')); if (!result?.filename) process.exit(1); process.stdout.write(result.filename)")
          TARBALL_PATH="$PWD/artifacts/$TARBALL"
          test -f "$TARBALL_PATH"
          tar -tzf "$TARBALL_PATH" > artifacts/contents.txt
          grep -q '^package/foundation/' artifacts/contents.txt
          grep -q '^package/adapters/' artifacts/contents.txt
          sha256sum "$TARBALL_PATH"
          echo "APEX_SKILLS_TARBALL=$TARBALL_PATH" >> "$GITHUB_ENV"

      # The packed-artifact tests consume APEX_SKILLS_TARBALL, so installer code
      # and content are exercised from the exact file published below.
      - name: Run foundation-skills tests
        run: node --test foundation-skills/test/*.test.mjs

      # ── Publish ──────────────────────────────────────────────────────────────
      # All steps below are skipped on workflow_dispatch dry runs.
      # Credentials are stored in GitHub Secrets and NEVER appear in logs.
      #
      # Required GitHub Secrets:
      #   AZURE_ARTIFACTS_ORG   — Azure DevOps org name (e.g. "amergis")
      #   AZURE_ARTIFACTS_FEED  — Feed name (e.g. "apex-skills")
      #   AZURE_ARTIFACTS_PAT   — PAT with Packaging Read + Write scope
      #
      # Optional GitHub Secrets:
      #   AZURE_ARTIFACTS_PROJECT — Set only for project-scoped feeds; omit for
      #                             org-scoped feeds (most common for npm packages)

      - name: Configure Azure Artifacts npm registry
        if: ${{ !inputs.dry_run }}
        env:
          AZURE_ARTIFACTS_ORG: ${{ secrets.AZURE_ARTIFACTS_ORG }}
          AZURE_ARTIFACTS_FEED: ${{ secrets.AZURE_ARTIFACTS_FEED }}
          AZURE_ARTIFACTS_PROJECT: ${{ secrets.AZURE_ARTIFACTS_PROJECT }}
          AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_ARTIFACTS_PAT }}
        run: |
          set -euo pipefail

          if [ -z "${AZURE_ARTIFACTS_ORG:-}" ] || [ -z "${AZURE_ARTIFACTS_FEED:-}" ] || [ -z "${AZURE_ARTIFACTS_PAT:-}" ]; then
            echo "::error::Missing required secrets. Set AZURE_ARTIFACTS_ORG, AZURE_ARTIFACTS_FEED, and AZURE_ARTIFACTS_PAT."
            exit 1
          fi

          # Build the feed registry URL. Project-scoped feeds include the
          # project segment; org-scoped feeds omit it.
          if [ -n "${AZURE_ARTIFACTS_PROJECT:-}" ]; then
            REGISTRY="https://pkgs.dev.azure.com/${AZURE_ARTIFACTS_ORG}/${AZURE_ARTIFACTS_PROJECT}/_packaging/${AZURE_ARTIFACTS_FEED}/npm/registry/"
            AUTH_HOST="//pkgs.dev.azure.com/${AZURE_ARTIFACTS_ORG}/${AZURE_ARTIFACTS_PROJECT}/_packaging/${AZURE_ARTIFACTS_FEED}/npm/registry/"
          else
            REGISTRY="https://pkgs.dev.azure.com/${AZURE_ARTIFACTS_ORG}/_packaging/${AZURE_ARTIFACTS_FEED}/npm/registry/"
            AUTH_HOST="//pkgs.dev.azure.com/${AZURE_ARTIFACTS_ORG}/_packaging/${AZURE_ARTIFACTS_FEED}/npm/registry/"
          fi

          # Azure Artifacts auth keys must use the //host/path/ form (no https:).
          # Use the raw PAT in _authToken (not base64). Keep lines unindented so
          # npm does not misparse the token as a config key name.
          {
            echo "@apex:registry=${REGISTRY}"
            echo "always-auth=true"
            echo "${AUTH_HOST}:_authToken=${AZURE_ARTIFACTS_PAT}"
          } > foundation-skills/.npmrc

          echo "APEX_SKILLS_REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"

      - name: Publish candidate to Azure Artifacts (Local view)
        if: ${{ !inputs.dry_run }}
        working-directory: foundation-skills
        run: |
          # Publish the exact tarball that passed the packed-artifact tests.
          npm publish "$APEX_SKILLS_TARBALL" \
            --registry "$APEX_SKILLS_REGISTRY" \
            --access restricted \
            --tag candidate

          echo "Published @apex/skills to Azure Artifacts (candidate tag)."
          echo "Next step: Platform Admin promotes via APEX UI > Platform Admin > APEX Skills > Publish."

      # Capture the tarball as a build artifact so the SHA-256 can be recorded
      # in the release record without re-downloading from the feed.
      - name: Upload tarball artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: apex-skills-tarball-${{ github.run_id }}
          path: foundation-skills/artifacts/*.tgz
          if-no-files-found: error
          retention-days: 30
