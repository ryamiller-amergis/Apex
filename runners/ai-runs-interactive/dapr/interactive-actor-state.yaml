apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: interactive-actor-state
spec:
  type: state.redis
  version: v1
  metadata:
    - name: redisHost
      value: host.docker.internal:6379
    - name: redisPassword
      value: ""
    - name: enableTLS
      value: "false"
    - name: actorStateStore
      value: "true"
