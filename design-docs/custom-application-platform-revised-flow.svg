    <text class="ts" x="720" y="1902" style="font-size:17px;fill:#111">Identity / RBAC / Tenancy &#183; Policy &amp; Secrets &#183; Audit Log &#183; Artifact &amp; Version Store &#183; Model &amp; Cost Router &#183; Observability / Tracing</text>
