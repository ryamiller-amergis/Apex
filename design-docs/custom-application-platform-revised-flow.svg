  <g transform="rotate(-0.3 1210 1692)"><rect class="box" x="1050" y="1650" width="320" height="62"/><text class="t" x="1210" y="1676">Skill Learning System</text><text class="ts" x="1210" y="1698">(proposes new versions only)</text></g>
  <path class="flow" d="M1210 1712 L1210 1738"/>
  <g transform="rotate(0.2 1210 1766)"><rect class="boxNew" x="1050" y="1740" width="320" height="54"/><text class="t" x="1210" y="1765">Evaluation Gate</text><text class="ts" x="1210" y="1786">(offline eval promotes / rejects)</text></g>
