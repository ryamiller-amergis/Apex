  <g transform="rotate(-0.4 170 1012)"><rect class="boxSide" x="45" y="992" width="250" height="42"/><text class="ts" x="170" y="1019" style="font-size:17px;fill:#111">UI Layout Templates</text></g>
  <g transform="rotate(0.3 720 1012)"><rect class="boxSide" x="595" y="992" width="250" height="42"/><text class="ts" x="720" y="1019" style="font-size:17px;fill:#111">Architectural Patterns</text></g>
