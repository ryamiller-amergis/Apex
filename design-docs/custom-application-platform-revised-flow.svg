      .ts { font-size:16px; fill:#444; }
      .stage { font-size:15px; fill:#666; text-anchor:start; letter-spacing:2px; }
      .flow { fill:none; stroke:#111; stroke-width:2.2; marker-end:url(#arrow); }
      .loop { fill:none; stroke:#666; stroke-width:2; stroke-dasharray:7 5; marker-end:url(#arrowGray); }
      .lbl { font-size:15px; fill:#555; }
      .new { font-size:13px; font-weight:bold; fill:#111; }
